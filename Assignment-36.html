<!DOCTYPE html>

<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Beautiful responsive photo gallery built with CSS Grid.">

  <title>My Photo Gallery | CSS Grid</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #101820, #263849);
      color: white;
      padding: 40px 20px;
      min-height: 100vh;
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 35px;
    }

    .header h1 {
      font-size: clamp(30px, 5vw, 45px);
      margin-bottom: 12px;
      background: linear-gradient(90deg, #00dbde, #fc00ff);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
    }

    .header p {
      color: #cbd5e1;
      font-size: 16px;
    }

    /* Gallery Grid */
    .gallery {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-auto-rows: 190px;
      gap: 15px;
      max-width: 1150px;
      margin: auto;
    }

    /* Gallery Figure */
    .gallery figure {
      position: relative;
      overflow: hidden;
      border-radius: 14px;
      cursor: pointer;
      background: #263849;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }

    .gallery img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.5s ease;
    }

    /* Image Hover */
    .gallery figure:hover img {
      transform: scale(1.12);
    }

    /* Image Caption */
    .gallery figcaption {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 15px;
      font-size: 16px;
      font-weight: bold;
      background: linear-gradient(transparent, rgba(0, 0, 0, 0.9));
      transform: translateY(5px);
      transition: 0.3s;
    }

    .gallery figure:hover figcaption {
      transform: translateY(0);
    }

    /* Grid Sizes */
    .wide {
      grid-column: span 2;
    }

    .tall {
      grid-row: span 2;
    }

    .big {
      grid-column: span 2;
      grid-row: span 2;
    }

    /* Footer */
    footer {
      text-align: center;
      margin-top: 40px;
      color: #cbd5e1;
      font-size: 14px;
    }

    /* Tablet */
    @media (max-width: 800px) {
      .gallery {
        grid-template-columns: repeat(2, 1fr);
        grid-auto-rows: 180px;
      }
    }

    /* Mobile */
    @media (max-width: 480px) {
      body {
        padding: 25px 12px;
      }

      .gallery {
        grid-template-columns: 1fr;
        grid-auto-rows: 230px;
      }

      .wide,
      .big {
        grid-column: auto;
      }

      .tall,
      .big {
        grid-row: span 1;
      }
    }

  </style>

</head>

<body>

  <!-- Header -->
