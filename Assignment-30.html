<!DOCTYPE html>

<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Profile card and product card components.">
  <title>Profile Card & Product Card</title>

  <style>
    :root {
      --primary: #5b4bdb;
      --secondary: #00b4d8;
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #e0e7ff, #f0fdfa);
      font-family: 'Segoe UI', Arial, sans-serif;
      display: flex;
      flex-wrap: wrap;
      gap: 40px;
      justify-content: center;
      align-items: center;
      padding: 50px 20px;
    }

    .page-heading {
      width: 100%;
      text-align: center;
      margin-bottom: 10px;
    }

    .page-heading h1 {
      color: #312e81;
      font-size: 2.3rem;
      margin-bottom: 8px;
    }

    .page-heading p {
      color: #64748b;
    }


    .profile {
      width: 320px;
      background: #fff;
      border-radius: var(--radius);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
      text-align: center;
      overflow: hidden;
      transition: 0.3s;
    }

    .profile:hover {
      transform: translateY(-8px);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.18);
    }

    .profile__cover {
      height: 120px;
      background: linear-gradient(120deg, #5b4bdb, #00b4d8);
    }

    .profile__avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: 5px solid white;
      margin-top: -55px;
      object-fit: cover;
      background: #e2e8f0;
    }

    .profile__body {
      padding: 10px 25px 25px;
    }

    .profile h2 {
      color: #312e81;
      font-size: 23px;
      margin-bottom: 5px;
    }

    .profile p {
      color: #64748b;
      margin-bottom: 20px;
      font-size: 14px;
    }

    .stats {
      display: flex;
      justify-content: space-around;
      border-top: 1px solid #e5e7eb;
      padding-top: 18px;
      margin-bottom: 20px;
    }

    .stats strong {
      display: block;
      font-size: 20px;
      color: #5b4bdb;
    }

    .stats span {
      font-size: 12px;
      color: #94a3b8;
    }

    .btn {
      display: inline-block;
      background: var(--primary);
      color: white;
      padding: 11px 30px;
      border-radius: 50px;
      text-decoration: none;
      font-weight: 600;
      transition: 0.3s;
    }

    .btn:hover {
      background: #3f31b0;
      transform: scale(1.04);
    }

    .product {
      width: 320px;
      background: white;
      border-radius: var(--radius);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
      overflow: hidden;
      position: relative;
      transition: 0.3s;
    }

    .product:hover {
      transform: translateY(-8px);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.18);
    }

    .product img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
      background: #f1f5f9;
    }

    .product__tag {
      position: absolute;
      top: 15px;
      left: 15px;
      background: #e63946;
      color: white;
      font-size: 13px;
      font-weight: 700;
      padding: 7px 14px;
      border-radius: 50px;
    }

    .product__body {
      padding: 22px;
    }

    .product h2 {
      color: #1e293b;
      font-size: 21px;
      margin-bottom: 8px;
    }

    .rating {
      color: #f4a100;
      font-size: 17px;
      margin-bottom: 12px;
    }

    .rating small {
      color: #64748b;
      font-size: 13px;
    }

    .price {
      margin: 15px 0;
    }

    .price strong {
      font-size: 25px;
      color: #16a34a;
    }

    .price s {
      color: #94a3b8;
      margin-left: 8px;
      font-size: 15px;
    }

    .product .btn {
      display: block;
      text-align: center;
      border-radius: 10px;
      background: #16a34a;
    }

    .product .btn:hover {
      background: #15803d;
    }


    @media (max-width: 600px) {
      body {
        padding: 30px 15px;
        gap: 30px;
      }

      .page-heading h1 {
        font-size: 1.8rem;
      }

      .profile,
      .product {
        width: min(100%, 340px);
      }
    }
  </style>

</head>

<body>

  <header class="page-heading">
    <h1>Our Cards Design</h1>
    <p>Beautiful Profile and Product Card Components</p>
  </header>

  <article class="profile">

```

</body>
</html>
