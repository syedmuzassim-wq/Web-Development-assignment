<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flexbox Landing Section</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Arial, sans-serif;
    }

    body{
        background:#f4f4f4;
    }

    .landing{
        display:flex;
        justify-content:space-between;
        align-items:center;
        min-height:100vh;
        padding:50px 10%;
        background:linear-gradient(to right,#4facfe,#00f2fe);
        color:white;
    }

    .content{
        flex:1;
        padding-right:40px;
    }

    .content h1{
        font-size:3rem;
        margin-bottom:20px;
    }

    .content p{
        font-size:1.1rem;
        line-height:1.6;
        margin-bottom:25px;
    }

    .btn{
        display:inline-block;
        padding:12px 28px;
        background:white;
        color:#0077cc;
        text-decoration:none;
        border-radius:5px;
        font-weight:bold;
        transition:0.3s;
    }

    .btn:hover{
        background:#222;
        color:white;
    }

    .image-section{
        flex:1;
        text-align:center;
    }

    .image-section img{
        width:100%;
        max-width:500px;
        border-radius:15px;
        box-shadow:0 10px 20px rgba(0,0,0,0.2);
    }

    /* Responsive Design */
    @media (max-width:768px){
        .landing{
            flex-direction:column;
            text-align:center;
        }

        .content{
            padding-right:0;
            margin-bottom:30px;
        }

        .content h1{
            font-size:2.2rem;
        }
    }
</style>
</head>
<body>

<section class="landing">

    <div class="content">
        <h1>Welcome to Our Website</h1>

        <p>
            Build modern and responsive websites using
            HTML and CSS Flexbox. Create beautiful layouts
            that work perfectly on desktop, tablet, and mobile devices.
        </p>

        <a href="#" class="btn">Learn More</a>
    </div>

    <div class="image-section">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRGf4r1bpRHli7uA_qts25mF-NtW8HWYf5HouCkQeJW6w&s=10"
             alt="Landing Image">
    </div>

</section>

</body>
</html>
