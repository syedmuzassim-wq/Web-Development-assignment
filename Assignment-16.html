<!DOCTYPE html>

<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Student registration form">

  <title>Student Registration</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px 15px;
    }

    .container {
      background: white;
      width: 100%;
      max-width: 550px;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
    }

    h1 {
      text-align: center;
      color: #4f46e5;
      margin-bottom: 25px;
    }

    form p {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
      color: #333;
    }

    input[type="text"],
    input[type="email"],
    input[type="tel"],
    input[type="password"],
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 15px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #667eea;
      box-shadow: 0 0 5px rgba(102, 126, 234, 0.4);
    }

    fieldset {
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 18px;
    }

    legend {
      font-weight: bold;
      color: #4f46e5;
      padding: 0 8px;
    }

    fieldset label {
      display: inline-block;
      margin-right: 15px;
      font-weight: normal;
    }

    input[type="radio"],
    input[type="checkbox"] {
      margin-right: 5px;
    }

    .terms {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: normal;
    }

    .terms input {
      width: auto;
    }

    .buttons {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }

    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 7px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    button[type="submit"] {
      background: #4f46e5;
      color: white;
    }

    button[type="reset"] {
      background: #e5e7eb;
      color: #333;
    }

    button:hover {
      opacity: 0.85;
      transform: translateY(-2px);
    }

    @media (max-width: 480px) {
      .container {
        padding: 20px;
      }

      fieldset label {
        margin-bottom: 8px;
      }
    }
  </style>

</head>

<body>

  <div class="container">

```
<h1>Student Registration Form</h1>

<form action="#" method="post">

  <p>
    <label for="name">Full Name:</label>
    <input type="text" id="name" name="name"
      required placeholder="Enter your full name">
  </p>

  <p>
    <label for="email">Email:</label>
    <input type="email" id="email" name="email"
      required placeholder="Enter your email">
  </p>

  <p>
    <label for="phone">Phone:</label>
    <input type="tel" id="phone" name="phone"
      pattern="[0-9]{10}" placeholder="10 digits">
  </p>

  <p>
    <label for="pass">Password:</label>
    <input type="password" id="pass" name="password"
      minlength="8" required placeholder="Minimum 8 characters">
  </p>

  <fieldset>
    <legend>Gender</legend>

    <label>
      <input type="radio" name="gender" value="male"> Male
    </label>

    <label>
      <input type="radio" name="gender" value="female"> Female
    </label>

    <label>
      <input type="radio" name="gender" value="other"> Other
    </label>
  </fieldset>

  <p>
    <label for="course">Course:</label>

    <select id="course" name="course" required>
      <option value="">-- Select Course --</option>
      <option>B.Tech CSE</option>
      <option>BCA</option>
      <option>B.Sc IT</option>
    </select>
  </p>

  <p>
    <label class="terms">
      <input type="checkbox" name="terms" required>
      I agree to the terms and conditions
    </label>
  </p>

  <div class="buttons">
    <button type="submit">Register</button>
    <button type="reset">Clear</button>
  </div>

</form>
```

  </div>

</body>
</html>
