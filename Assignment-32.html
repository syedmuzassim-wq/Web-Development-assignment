<!DOCTYPE html>

<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Perfectly centred login form using Flexbox.">
  <title>Centred Login Form</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea, #764ba2);
      font-family: 'Segoe UI', Arial, sans-serif;
      padding: 20px;
    }


    .login {
      width: 100%;
      max-width: 400px;
      background: #fff;
      padding: 35px;
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
      display: flex;
      flex-direction: column;
      gap: 20px;
      animation: slideUp 0.7s ease;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }


    .login h1 {
      text-align: center;
      color: #333;
      font-size: 30px;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #888;
      font-size: 14px;
      margin-top: -12px;
    }

    .icon {
      width: 65px;
      height: 65px;
      background: #eeeaff;
      color: #764ba2;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      margin: 0 auto;
    }


    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-weight: 600;
      color: #444;
      font-size: 14px;
    }

    .field input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 9px;
      font-size: 15px;
      font-family: inherit;
      transition: 0.3s;
    }

    .field input:focus {
      outline: none;
      border-color: #764ba2;
      box-shadow: 0 0 0 3px rgba(118, 75, 162, 0.15);
    }


    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: #555;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .row a {
      color: #764ba2;
      text-decoration: none;
      font-weight: 600;
    }

    .row a:hover {
      text-decoration: underline;
    }


    button {
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      transform: translateY(-3px);
      box-shadow: 0 7px 18px rgba(118, 75, 162, 0.35);
    }


    .signup {
      text-align: center;
      color: #777;
      font-size: 14px;
    }

    .signup a {
      color: #764ba2;
      text-decoration: none;
      font-weight: 700;
    }

    .signup a:hover {
      text-decoration: underline;
    }


    @media (max-width: 450px) {
      .login {
        padding: 25px 20px;
      }

      .login h1 {
        font-size: 25px;
      }

      .row {
        font-size: 12px;
      }
    }
  </style>

</head>

<body>


  <form class="login" action="#" method="post">

```
<div class="icon">🔐</div>

<h1>Welcome Back!</h1>

<p class="subtitle">Login to your account to continue</p>


<label class="field">
  Email Address
  <input
    type="email"
    name="email"
    required
    placeholder="you@gmail.com">
</label>

<label class="field">
  Password
  <input
    type="password"
    name="password"
    required
    minlength="8"
    placeholder="Enter your password">
</label>


<div class="row">

  <label class="remember">
    <input type="checkbox" name="remember">
    Remember me
  </label>

  <a href="#">Forgot password?</a>

</div>

<button type="submit">Log In →</button>

<p class="signup">
  Don't have an account?
  <a href="#">Sign Up</a>
</p>
```

  </form>

</body>
</html>
